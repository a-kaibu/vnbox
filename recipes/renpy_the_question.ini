[game]
title=The Question (Ren'Py 8.5.3 SDK 同梱)
engine=Ren'Py 8 (Python3/SDL2/OpenGL, x64)
source=https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.zip
install=extract
[launch]
local=games/renpy
dir=renpy-8.5.3-sdk
exe=renpy.exe
args=the_question
[prefix]
xvfb=1280x800
arch=win64
winver=win10
[result]
status=works
notes=Win7指定だと "requires Windows 10" で起動拒否 -> 64bitベースはwin10既定に
[test]
wait=30
input=click:62,237 sleep:5 click:600,400 click:600,400 shot:story
