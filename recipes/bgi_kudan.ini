[game]
title=クダンノフォークロア 体験版
engine=BGI/Ethornell (Direct3D9)
source=http://sukerasparo.com/data/kudan_trial.zip
install=installer:BGI 独自 Setup.exe -> capture.sh (パッケージ: packages/bgi_kudan)
[launch]
local=packages/bgi_kudan
target=SukeraSparo/クダンノフォークロア体験版/BGI.exe
[prefix]
arch=win32
[test]
wait=40
input=sleep:20 click:1104,344 sleep:6 click:640,400 click:640,400 shot:story
[result]
status=works
notes=Setup.exe が HKLM\Software\SukeraSparo\<title>\InstalledFolder を書く。展開フォルダ直起動ではウィンドウが出なかった。起動直後に CriticalSection 待ちで最大40秒ほど黒画面になることがある
