name: test

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # IPA fonts: the ＭＳ ゴシック alias font test, 7-Zip: archive tests, bubblewrap: the sandbox test,
      # moto: the S3 tests run against a local S3-compatible server
      - name: tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-ipafont-gothic fonts-ipafont-mincho p7zip-full bubblewrap
          # a venv of its own: the runner's system boto3 / pyOpenSSL clash with moto's
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install -q "moto[server]"
          echo "MOTO_SERVER=$RUNNER_TEMP/moto/bin/moto_server" >> "$GITHUB_ENV"
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "not gofmt-ed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build -o bin/vnbox ./cmd/vnbox && go build -o bin/rtcprobe ./cmd/rtcprobe
